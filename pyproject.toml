[project]
name = "python-template"
version = "0.1.0"
description = "python-template"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
test = ["pytest==9.1.1", "pytest-sugar==1.1.1", "pytest-cov==7.1.0"]
quality = ["pre-commit==4.6.0", "ruff==0.15.21"]

[tool.pytest]
addopts = ["-ra", "-v", "-l", "-m", "not integration"]
markers = [
  "integration: tests that call real external dependencies (DB, external APIs, LLMs, ...)",
]

[tool.coverage.run]
# The package to measure with `pytest --cov`. Rename it together with the package.
source = ["python_template"]

[tool.ruff]
line-length = 119
# Respect exclude even for paths passed explicitly (pre-commit hooks)
force-exclude = true

# Exclude the following files and directories.
exclude = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "buck-out",
  "build",
  "dist",
  "env",
  "venv",
]

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E402"]
select = ["C", "E", "F", "I", "W"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
